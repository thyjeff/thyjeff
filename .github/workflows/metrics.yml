name: metrics

# Regenerates the animated embodied-AI console SVG from live GitHub data.
on:
  schedule:
    - cron: "37 3 * * *" # daily @ 03:37 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate dashboard
        run: python scripts/generate_metrics.py
        env:
          GH_USERNAME: thyjeff
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name  "metrics-bot"
          git config user.email "183022254+thyjeff@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "chore: refresh dashboard [skip ci]" && git push)
